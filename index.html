<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amex Bank | Secure Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-university"></i>
          </div>
          <div class="logo-text">
            <span class="bank-name">Amex Bank</span>
            <span class="bank-tagline">Premium Banking</span>
          </div>
        </div>
      </div>

      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Sign in to access your accounts securely</p>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="remember">
            <span class="checkmark"></span>
            Remember Me
          </label>
          <a href="#" class="forgot-link" id="forgotPassword">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="security-badge">
        <i class="fas fa-shield-alt"></i>
        <span>256-bit SSL Encryption • FDIC Insured</span>
      </div>

      <div id="loginError" class="error-message" style="display: none;">
        <i class="fas fa-exclamation-circle"></i>
        <span>Invalid username or password. Please try again.</span>
      </div>
    </div>

    <div class="login-footer">
      <p>&copy; 2026 Amex Bank. All rights reserved. Member FDIC.</p>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Security</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
